[project]
name = "portal2-beta-patcher"
version = "0.1.0"
description = "Reconstruct and repair Portal 2 prerelease build 852_0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45.0.0",
    "tkinterdnd2>=0.4.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.15.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

